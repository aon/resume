name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          # Pinned because mise's VERSION endpoint can point at a release whose
          # assets are not published yet, which 404s the download.
          version: 2026.9.2
          install: true
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$tag" output/*.pdf \
            --title "$tag" \
            --notes "Resumes built from ${GITHUB_SHA}." \
            --latest
